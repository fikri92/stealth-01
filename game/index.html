<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightvault — a top-down stealth infiltration</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f13; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Nightvault: a top-down stealth game. Sneak past patrolling guards with vision cones, take the keycard, and reach the exit unseen. Move with WASD, hold Shift to crouch quietly, P to pause."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
